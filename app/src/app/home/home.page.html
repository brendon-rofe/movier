<!-- Fixed Header -->
<header class="app-header">
  <div class="header-inner">
    <div class="header-left">
      <span class="material-symbols-outlined header-logo-icon">movie_filter</span>
      <h1 class="header-title">CineTrack</h1>
    </div>
    <div class="header-right">
      <span class="material-symbols-outlined header-btn" routerLink="/search">search</span>
      <div class="avatar">
        <img [src]="profileImage" alt="Profile" />
      </div>
    </div>
  </div>
</header>

<ion-content class="main-content">
  <section class="section">
    <div class="section-header">
      <h3 class="section-title">Popular Movies</h3>
    </div>

    <div class="movie-grid">
      @for (movie of popularMovies; track movie.id) {
        <div class="movie-card">
          <div class="movie-poster" (click)="openDetail(movie.id)" style="cursor: pointer;">
            <img [src]="getImageUrl(movie.poster_path)" [alt]="movie.title" />
            <div class="movie-rating">
              <span class="material-symbols-outlined rating-icon">star</span>
              <span>{{ movie.vote_average.toFixed(1) }}</span>
            </div>
          </div>
          <div class="movie-info">
            <h4 class="movie-title">{{ movie.title }}</h4>
            <p class="movie-year">{{ movie.release_date.substring(0, 4) }}</p>
            <div class="card-buttons">
              <button
                class="card-lib-btn"
                [class.in-library]="libraryService.isInLibrary(movie.id)"
                (click)="toggleLibrary(movie)"
              >
                <span class="material-symbols-outlined card-btn-icon">
                  {{ libraryService.isInLibrary(movie.id) ? 'check' : 'add' }}
                </span>
                {{ libraryService.isInLibrary(movie.id) ? 'In Library' : 'Add' }}
              </button>
              <button class="detail-btn" (click)="openDetail(movie.id)">
                <span class="material-symbols-outlined card-btn-icon">info</span>
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  </section>
</ion-content>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
  <div class="nav-item active">
    <span class="material-symbols-outlined nav-icon" style="font-variation-settings: 'FILL' 1;">home</span>
    <span class="nav-label">Home</span>
  </div>
  <div class="nav-item" routerLink="/search">
    <span class="material-symbols-outlined nav-icon">search</span>
    <span class="nav-label">Search</span>
  </div>
  <div class="nav-item" routerLink="/library">
    <span class="material-symbols-outlined nav-icon">subscriptions</span>
    <span class="nav-label">Library</span>
  </div>
  <div class="nav-item" routerLink="/settings">
    <span class="material-symbols-outlined nav-icon">settings</span>
    <span class="nav-label">Settings</span>
  </div>
</nav>
