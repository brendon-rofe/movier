<header class="app-header">
  <div class="header-inner">
    <div class="header-left">
      <span class="material-symbols-outlined header-logo-icon">movie_filter</span>
      <h1 class="header-title">CineTrack</h1>
    </div>
  </div>
</header>

<ion-content class="main-content">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-icon-wrap">
        <span class="material-symbols-outlined auth-icon">account_circle</span>
      </div>
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Sign in to continue tracking your movies & series</p>

      @if (error) {
        <div class="error-msg">{{ error }}</div>
      }

      <div class="input-group">
        <label class="input-label">Username</label>
        <div class="input-wrap">
          <span class="material-symbols-outlined input-icon">person</span>
          <input
            class="auth-input"
            type="text"
            placeholder="Enter your username"
            [(ngModel)]="username"
            (keydown.enter)="login()"
          />
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">Password</label>
        <div class="input-wrap">
          <span class="material-symbols-outlined input-icon">lock</span>
          <input
            class="auth-input"
            type="password"
            placeholder="Enter your password"
            [(ngModel)]="password"
            (keydown.enter)="login()"
          />
        </div>
      </div>

      <div class="remember-row">
        <label class="checkbox-label">
          <input type="checkbox" [(ngModel)]="rememberMe" />
          <span class="checkbox-text">Remember me</span>
        </label>
      </div>

      <button class="auth-btn" (click)="login()" [disabled]="loading">
        @if (loading) {
          Signing in...
        } @else {
          Sign In
        }
        <span class="material-symbols-outlined auth-btn-icon">arrow_forward</span>
      </button>

      <p class="auth-link">
        Don't have an account?
        <a routerLink="/register">Create one</a>
      </p>
    </div>
  </div>
</ion-content>
