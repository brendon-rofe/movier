<header class="app-header">
  <div class="header-inner">
    <div class="header-left">
      <span class="material-symbols-outlined header-logo-icon">movie_filter</span>
      <h1 class="header-title">CineTrack</h1>
    </div>
  </div>
</header>

<ion-content class="main-content">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-icon-wrap">
        <span class="material-symbols-outlined auth-icon">lock_reset</span>
      </div>

      @if (step === 'username') {
        <h2 class="auth-title">Forgot Password?</h2>
        <p class="auth-subtitle">Enter your username to verify your identity</p>

        @if (error) {
          <div class="error-msg">{{ error }}</div>
        }

        <div class="input-group">
          <label class="input-label">Username</label>
          <div class="input-wrap">
            <span class="material-symbols-outlined input-icon">person</span>
            <input
              class="auth-input"
              type="text"
              placeholder="Enter your username"
              [(ngModel)]="username"
              (keydown.enter)="fetchQuestion()"
            />
          </div>
        </div>

        <button class="auth-btn" (click)="fetchQuestion()" [disabled]="loading">
          @if (loading) {
            Verifying...
          } @else {
            Continue
          }
          <span class="material-symbols-outlined auth-btn-icon">arrow_forward</span>
        </button>
      } @else {
        <h2 class="auth-title">Security Question</h2>
        <p class="auth-subtitle">{{ securityQuestion }}</p>

        @if (error) {
          <div class="error-msg">{{ error }}</div>
        }

        <div class="input-group">
          <label class="input-label">Your Answer</label>
          <div class="input-wrap">
            <span class="material-symbols-outlined input-icon">help</span>
            <input
              class="auth-input"
              type="text"
              placeholder="Enter your answer"
              [(ngModel)]="securityAnswer"
              (keydown.enter)="resetPassword()"
            />
          </div>
        </div>

        <div class="input-group">
          <label class="input-label">New Password</label>
          <div class="input-wrap">
            <span class="material-symbols-outlined input-icon">lock</span>
            <input
              class="auth-input"
              type="password"
              placeholder="Choose a new password"
              [(ngModel)]="newPassword"
              (keydown.enter)="resetPassword()"
            />
          </div>
        </div>

        <div class="input-group">
          <label class="input-label">Confirm Password</label>
          <div class="input-wrap">
            <span class="material-symbols-outlined input-icon">lock</span>
            <input
              class="auth-input"
              type="password"
              placeholder="Confirm your new password"
              [(ngModel)]="confirmPassword"
              (keydown.enter)="resetPassword()"
            />
          </div>
        </div>

        <button class="auth-btn" (click)="resetPassword()" [disabled]="loading">
          @if (loading) {
            Resetting...
          } @else {
            Reset Password
          }
          <span class="material-symbols-outlined auth-btn-icon">check</span>
        </button>
      }

      <p class="auth-link">
        Back to
        <a routerLink="/login">Sign in</a>
      </p>
    </div>
  </div>
</ion-content>
