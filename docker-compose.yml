services:
  mysql:
    image: mysql:8
    container_name: cinetrack-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_USER: cinetrack
      MYSQL_PASSWORD: cinetrack
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cinetrack
    volumes:
      - mysqldata:/var/lib/mysql

volumes:
  mysqldata:
